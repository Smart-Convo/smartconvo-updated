<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 2560" width="1440" height="2560">
  <defs>
    <!-- Background Base Gradient -->
    <linearGradient id="sky-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#01040D" />
      <stop offset="30%" stop-color="#020617" />
      <stop offset="45%" stop-color="#001B3A" />
      <stop offset="65%" stop-color="#0369A1" />
      <stop offset="80%" stop-color="#06B6D4" />
      <stop offset="92%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Vertical Streak Filter matching user code -->
    <filter id="vertical-streaks" color-interpolation-filters="sRGB" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.14 0.0001" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="110" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <linearGradient id="needle-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0" />
      <stop offset="15%" stop-color="#0284C7" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#06B6D4" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="85%" stop-color="#F0F9FF" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <linearGradient id="base-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="35%" stop-color="#020617" />
      <stop offset="48%" stop-color="#0095D9" />
      <stop offset="62%" stop-color="#38BDF8" />
      <stop offset="78%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Midnight Top -->
  <rect width="1440" height="2560" fill="#020617" />

  <!-- Smooth Underlying Aurora Glow -->
  <path
    d="M 0 896 Q 835 1433 1440 947 L 1440 2560 L 0 2560 Z"
    fill="url(#base-glow)"
    filter="url(#vertical-streaks)"
  />

