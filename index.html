<!doctype html>
<html lang="en">
  <head>
    <script>
      // Ensure window.fetch has both getter and setter so test runners/proxies can wrap window.fetch without throwing
      (function() {
        try {
          var _origFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _origFetch;
            },
            set: function(val) {
              _origFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // ignore if already non-configurable
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Security Headers / Directives -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(self), geolocation=()" />
    
    <title>Smart Convo | Enterprise Voice AI for Real Estate, Retail & Healthcare</title>
    <meta name="description" content="Enterprise Voice AI platform for Real Estate Developers, Retail Brands, and Healthcare Clinics. Answer every call, qualify every lead in Urdu & English with sub-second latency." />

    <meta property="og:description" content="Enterprise Voice AI platform for Real Estate Developers, Retail Brands, and Healthcare Clinics. Answer every call, qualify every lead in Urdu & English with sub-second latency." />
    <meta property="og:type" content="website" />

    <meta name="twitter:title" content="Smart Convo | Enterprise Voice AI" />
    <meta name="twitter:description" content="Enterprise Voice AI platform for Real Estate Developers, Retail Brands, and Healthcare Clinics." />

    <!-- Fast DNS Prefetch & Preconnect for High-Speed Typography -->
